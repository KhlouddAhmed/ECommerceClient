<nav class="navbar d-flex align-items-center justify-content-between"
     style="background:#1a1f2e">
  <a class="brand" routerLink="/">
    Shop<span>Hub</span>
  </a>

  <div class="d-flex align-items-center gap-3">
    <a routerLink="/" routerLinkActive="active" class="nav-link">
      Products
    </a>

    @if (authService.currentUser()) {
      <a routerLink="/orders" class="nav-link">Orders</a>

      <a routerLink="/cart" class="nav-link cart-link">
        Cart
        @if (cartService.totalItems() > 0) {
          <span class="cart-badge">{{ cartService.totalItems() }}</span>
        }
      </a>

      @if (authService.getRole() === 'Admin') {
        <a routerLink="/admin" class="nav-link">Dashboard</a>
      }

      <span class="user-name">{{ authService.currentUser()?.fullName }}</span>
      <button class="logout-btn" (click)="authService.logout()">Logout</button>
    } @else {
      <a routerLink="/login" class="btn-accent">Login</a>
    }
  </div>
</nav>
