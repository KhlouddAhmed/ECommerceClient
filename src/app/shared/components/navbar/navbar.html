<nav class="navbar navbar-expand-lg" style="background:#1a1f2e">
  <div class="container">

    <a class="navbar-brand text-white fw-semibold" routerLink="/">
      Shop<span style="color:#4f8ef7">Hub</span>
    </a>

    <div class="d-flex align-items-center gap-3">

      <a routerLink="/" routerLinkActive="text-white"
         class="text-white-50 text-decoration-none small">
        Products
      </a>

      @if (authService.currentUser()) {
        <a routerLink="/orders"
           class="text-white-50 text-decoration-none small">
          Orders
        </a>
        <a routerLink="/cart"
           class="text-white-50 text-decoration-none small">
          Cart
        </a>

        @if (authService.getRole() === 'Admin') {
          <a routerLink="/admin"
             class="text-white-50 text-decoration-none small">
            Dashboard
          </a>
        }

        <span class="text-white-50 small">
          {{ authService.currentUser()?.fullName }}
        </span>

        <button class="btn btn-sm btn-outline-light"
                (click)="authService.logout()">
          Logout
        </button>
      } @else {
        <a routerLink="/login"
           class="btn btn-sm"
           style="background:#4f8ef7;color:white">
          Login
        </a>
      }

    </div>
  </div>
</nav>
