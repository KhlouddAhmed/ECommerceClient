<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <h4>Create account</h4>
      <p>Join us today</p>
    </div>

    <div class="auth-body">
      @if (error) {
        <div class="alert-error mb-3">{{ error }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input formControlName="fullName" type="text"
                 class="form-input" placeholder="Khloud Ahmed">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input formControlName="email" type="email"
                 class="form-input" placeholder="you@email.com">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input formControlName="password" type="password"
                 class="form-input" placeholder="Min 6 characters">
        </div>

        <div class="mb-4">
          <label class="form-label">Role</label>
          <select formControlName="role" class="form-input">
            <option value="Customer">Customer</option>
            <option value="Seller">Seller</option>
          </select>
        </div>

        <button type="submit" class="submit-btn"
                [disabled]="loading || form.invalid">
          {{ loading ? 'Creating...' : 'Create account' }}
        </button>
      </form>

      <div class="auth-footer">
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </div>
    </div>

  </div>
</div>
